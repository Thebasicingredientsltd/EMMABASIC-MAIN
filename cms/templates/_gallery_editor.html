{# Reusable photo-list editor (same pattern as product galleries).
   Expects `gallery_photos` as [{path, size}, ...]. #}
<style>
  .gallery-item { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .gallery-item:first-child { padding-top: 0; }
  .gallery-item:last-child { border-bottom: none; }
  .img-size { font-size: 12px; margin-top: 6px; }
  .eb-drag-handle {
    flex-shrink: 0; width: 28px; height: 36px; margin: 0 2px 0 -4px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-40); background: transparent; border: none; border-radius: var(--r-sm);
    cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none;
    transition: color var(--dur) var(--ease-out), background var(--dur) var(--ease-out);
  }
  .eb-drag-handle:hover { color: var(--ink); background: var(--paper-shade); }
  .eb-drag-handle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .eb-sorting .eb-drag-handle, .eb-sorting * { cursor: grabbing !important; }
  .eb-sorting { -webkit-user-select: none; user-select: none; }
  .gallery-item.eb-dragging {
    z-index: 40; background: var(--paper-bright);
    padding-left: 12px; padding-right: 12px;
    border-radius: var(--r-md) !important; border-bottom-color: transparent !important;
    box-shadow: var(--shadow-lg); cursor: grabbing;
  }
  .eb-ph {
    box-sizing: border-box; border-radius: var(--r-md);
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    border: 1px dashed var(--rule-strong);
  }
</style>
<input type="hidden" name="gallery_photos_editor" value="1"/>
<div id="eb-gallery">
  {% for g in gallery_photos %}
  <div class="img-field gallery-item">
    <button type="button" class="eb-drag-handle" aria-label="Drag to reorder" title="Drag to reorder">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></g></svg>
    </button>
    <img class="preview" src="{{ url_for('site_assets', filename=g.path[7:]) if g.path.startswith('assets/') else g.path }}" alt="preview"/>
    <div class="grow">
      <input type="text" name="gallery_path" value="{{ g.path }}" placeholder="assets/..."/>
      <div class="img-size muted">Size: {{ g.size if g.size else 'unknown (file not found)' }}</div>
      <button type="button" class="btn danger small eb-remove-img" style="margin-top:10px;">Remove image</button>
    </div>
  </div>
  {% endfor %}
</div>
<div style="margin-top:14px;">
  <button type="button" class="btn secondary small" id="eb-add-img">+ Add image</button>
</div>
<script>
(function () {
  function galleryPreviewSrc(path) {
    if (!path) return "";
    return path.indexOf("assets/") === 0 ? "/site-assets/" + path.slice(7) : path;
  }
  function wireRemove(btn) {
    if (!btn) return;
    btn.addEventListener("click", function () {
      var item = btn.closest(".gallery-item");
      if (item) item.remove();
    });
  }
  document.querySelectorAll("#eb-gallery .eb-remove-img").forEach(wireRemove);

  var addBtn = document.getElementById("eb-add-img");
  if (addBtn) {
    addBtn.addEventListener("click", function () {
      var list = document.getElementById("eb-gallery");
      var row = document.createElement("div");
      row.className = "img-field gallery-item";
      row.innerHTML =
        '<button type="button" class="eb-drag-handle" aria-label="Drag to reorder" title="Drag to reorder">' +
          '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></g></svg>' +
        '</button>' +
        '<img class="preview" src="" alt="preview"/>' +
        '<div class="grow">' +
          '<input type="text" name="gallery_path" value="" placeholder="assets/..."/>' +
          '<div class="img-size muted"></div>' +
          '<button type="button" class="btn danger small eb-remove-img" style="margin-top:10px;">Remove image</button>' +
        '</div>';
      list.appendChild(row);
      if (window.ebInitImgField) window.ebInitImgField(row);
      wireRemove(row.querySelector(".eb-remove-img"));
      if (window.ebGalleryWireRow) window.ebGalleryWireRow(row);
    });
  }

  document.addEventListener("input", function (e) {
    if (e.target && e.target.name === "gallery_path") {
      var item = e.target.closest(".gallery-item");
      var prev = item && item.querySelector(".preview");
      if (prev) prev.src = galleryPreviewSrc(e.target.value.trim());
    }
  });
})();
</script>
<script>
(function () {
  var container = document.getElementById("eb-gallery");
  if (!container) return;

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DUR = reduce ? 0 : 220;

  function rowsIn() {
    return Array.prototype.filter.call(container.children, function (c) {
      return c.classList.contains("gallery-item");
    });
  }

  window.ebGalleryWireRow = function (row) {
    if (!row) return;
    var handle = row.querySelector(":scope > .eb-drag-handle");
    if (!handle || handle.dataset.ebWired) return;
    handle.dataset.ebWired = "1";
    handle.addEventListener("pointerdown", function (e) {
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      startPointer(row, e);
    });
  };

  rowsIn().forEach(window.ebGalleryWireRow);

  function startPointer(item, downEvent) {
    var pointerId = downEvent.pointerId;
    var startY = downEvent.clientY, startX = downEvent.clientX;
    var began = false, grabOffsetY = 0, placeholder = null, floatRect = null, lastRef;

    function onMove(e) {
      if (e.pointerId !== pointerId) return;
      if (!began) {
        if (Math.abs(e.clientY - startY) < 4 && Math.abs(e.clientX - startX) < 4) return;
        begin(e);
      }
      moveTo(e);
    }
    function onUp(e) {
      if (e.pointerId !== pointerId) return;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      if (began) finish();
    }

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);

    function begin(e) {
      began = true;
      var rect = item.getBoundingClientRect();
      floatRect = rect;
      grabOffsetY = e.clientY - rect.top;

      placeholder = document.createElement("div");
      placeholder.className = "eb-ph";
      placeholder.style.height = rect.height + "px";
      container.insertBefore(placeholder, item);

      item.classList.add("eb-dragging");
      item.style.position = "fixed";
      item.style.width = rect.width + "px";
      item.style.left = rect.left + "px";
      item.style.top = rect.top + "px";
      item.style.margin = "0";
      document.body.appendChild(item);
      document.body.classList.add("eb-sorting");

      lastRef = placeholder.nextElementSibling || null;
    }

    function firstRects() {
      var m = new Map();
      rowsIn().forEach(function (el) { m.set(el, el.getBoundingClientRect()); });
      return m;
    }
    function flip(prev) {
      if (reduce) return;
      rowsIn().forEach(function (el) {
        var a = prev.get(el); if (!a) return;
        var dy = a.top - el.getBoundingClientRect().top;
        if (!dy) return;
        el.style.transition = "none";
        el.style.transform = "translateY(" + dy + "px)";
        requestAnimationFrame(function () {
          el.style.transition = "transform " + DUR + "ms var(--ease-out)";
          el.style.transform = "";
        });
      });
    }

    function moveTo(e) {
      var top = e.clientY - grabOffsetY;
      item.style.top = top + "px";

      var center = top + floatRect.height / 2;
      var rows = rowsIn(), ref = null;
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i].getBoundingClientRect();
        if (center < r.top + r.height / 2) { ref = rows[i]; break; }
      }
      if (ref === lastRef) return;
      lastRef = ref;
      var prev = firstRects();
      if (ref) container.insertBefore(placeholder, ref);
      else container.appendChild(placeholder);
      flip(prev);
    }

    function finish() {
      container.insertBefore(item, placeholder);
      placeholder.remove();

      var fromTop = floatRect.top, fromLeft = floatRect.left;
      item.classList.remove("eb-dragging");
      item.style.position = "";
      item.style.width = "";
      item.style.left = "";
      item.style.top = "";
      item.style.margin = "";
      document.body.classList.remove("eb-sorting");

      if (!reduce) {
        var now = item.getBoundingClientRect();
        var dy = fromTop - now.top, dx = fromLeft - now.left;
        item.style.transition = "none";
        item.style.transform = "translate(" + dx + "px," + dy + "px)";
        requestAnimationFrame(function () {
          item.style.transition = "transform " + DUR + "ms var(--ease-out)";
          item.style.transform = "";
          setTimeout(function () { item.style.transition = ""; }, DUR + 40);
        });
      }
    }
  }
})();
</script>
