<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in · Emma Basic CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink: #14110D; --ink-60: #6B6459; --paper: #F4F0E8; --paper-bright: #FBF9F4;
      --rule: rgba(20,17,13,0.10); --rule-strong: rgba(20,17,13,0.22); --accent: #9A6A3C;
      --r-md: 12px; --shadow-lg: 0 18px 50px rgba(20,17,13,0.16);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 600px at 50% -10%, var(--paper-bright), var(--paper));
      font-family: "Inter", system-ui, sans-serif; color: var(--ink); padding: 24px;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--paper-bright);
      border: 1px solid var(--rule); border-radius: 18px; padding: 32px 28px;
      box-shadow: var(--shadow-lg); animation: rise 500ms var(--ease-out) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .brand { font-family: "Fraunces", serif; font-weight: 600; font-size: 24px; letter-spacing: -0.01em; margin: 0 0 4px; }
    .sub { color: var(--ink-60); font-size: 13.5px; margin: 0 0 22px; }
    label { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-60); margin-bottom: 8px; }
    input[type=password] {
      width: 100%; padding: 12px 14px; font-size: 15px; color: var(--ink);
      background: var(--paper); border: 1px solid var(--rule-strong); border-radius: var(--r-md);
      transition: border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out); outline: none;
    }
    input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    button {
      margin-top: 16px; width: 100%; padding: 12px 16px; font-size: 15px; font-weight: 600;
      color: #fff; background: var(--ink); border: none; border-radius: var(--r-md); cursor: pointer;
      transition: transform 140ms var(--ease-out), opacity 160ms var(--ease-out);
    }
    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.98); }
    .error {
      margin: 0 0 16px; padding: 10px 12px; font-size: 13px; border-radius: 10px;
      background: color-mix(in srgb, #b3261e 10%, transparent); color: #8f1d16;
      border: 1px solid color-mix(in srgb, #b3261e 30%, transparent);
    }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('login') }}{% if next %}?next={{ next }}{% endif %}">
    <h1 class="brand">Emma Basic</h1>
    <p class="sub">Content management — please sign in.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}"/>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autofocus autocomplete="current-password" required/>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
