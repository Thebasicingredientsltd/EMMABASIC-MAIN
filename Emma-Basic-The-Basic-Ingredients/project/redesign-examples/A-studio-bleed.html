<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A · Studio bleed — Premium Grade Matcha</title>
<link rel="stylesheet" href="../components/tokens.css"/>
<style>
  :root { --ease: cubic-bezier(0.23, 1, 0.32, 1); }
  .wrap { min-height: 100vh; display: grid; grid-template-columns: 1.15fr 0.85fr; }
  .visual {
    background: #fff url("../assets/products-original-backup/matcha-homepage.jpg") center / cover no-repeat;
    min-height: 100vh; position: relative;
  }
  .visual::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 55%, rgba(246,246,246,0.35));
    pointer-events: none;
  }
  .copy {
    background: var(--paper); padding: clamp(48px, 8vw, 96px);
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand {
    font-family: var(--f-display); font-weight: 300;
    font-size: clamp(42px, 5.5vw, 72px); letter-spacing: -0.04em; line-height: 0.92;
    margin: 0 0 28px;
  }
  .lot { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-60); margin-bottom: 18px; }
  h1 { font-family: var(--f-body); font-weight: 500; font-size: clamp(18px, 1.6vw, 22px); letter-spacing: 0.02em; margin: 0 0 14px; }
  .support { color: var(--ink-60); line-height: 1.55; max-width: 28ch; margin: 0 0 36px; }
  .cta {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--ink); color: #fff; text-decoration: none;
    padding: 16px 28px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    border: 0; width: fit-content;
    transition: transform 160ms var(--ease), background 160ms var(--ease);
  }
  .cta:hover { background: var(--ink-90); }
  .cta:active { transform: scale(0.97); }
  .back { position: fixed; top: 20px; left: 20px; z-index: 2; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; background: rgba(246,246,246,0.9); padding: 10px 14px; }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; }
    .visual { min-height: 55vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>
  <a class="back" href="index.html">← Examples</a>
  <div class="wrap">
    <div class="visual" role="img" aria-label="Premium Grade Matcha pouch"></div>
    <div class="copy">
      <div class="brand">Emma Basic</div>
      <div class="lot">Lot HB-240418 · Shade-grown 25 days</div>
      <h1>Premium Grade Matcha</h1>
      <p class="support">100% pure Tencha leaf. No additives. Batch tested.</p>
      <a class="cta" href="https://www.amazon.co.uk/dp/B0G8MW2WB7">Buy on Amazon</a>
    </div>
  </div>
</body>
</html>
