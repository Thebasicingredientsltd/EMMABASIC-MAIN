<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>B · Editorial split — Premium Grade Matcha</title>
<link rel="stylesheet" href="../components/tokens.css"/>
<style>
  :root { --ease: cubic-bezier(0.23, 1, 0.32, 1); }
  body { background: var(--paper); }
  .page { max-width: var(--maxw); margin: 0 auto; padding: 72px var(--pad-x) 120px; }
  .grid { display: grid; grid-template-columns: 1fr 0.9fr; gap: clamp(40px, 7vw, 96px); align-items: start; }
  .eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-60); margin-bottom: 28px; }
  h1 {
    font-family: var(--f-display); font-weight: 300;
    font-size: clamp(48px, 7vw, 92px); letter-spacing: -0.04em; line-height: 0.9;
    margin: 0 0 18px; max-width: 8ch;
  }
  .jp { font-family: var(--f-display); font-size: 22px; color: var(--ink-60); margin: 0 0 32px; }
  .rule { border: 0; border-top: 1px solid var(--rule-strong); margin: 0 0 28px; max-width: 120px; }
  .body { font-size: 16px; line-height: 1.65; color: var(--ink-90); max-width: 36ch; margin: 0 0 36px; }
  .cta {
    display: inline-flex; background: var(--ink); color: #fff; text-decoration: none;
    padding: 15px 26px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    transition: transform 160ms var(--ease);
  }
  .cta:active { transform: scale(0.97); }
  .photo { background: #fff; aspect-ratio: 3/4; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transform: scale(1.15); }
  .strip {
    margin-top: 72px; padding-top: 36px; border-top: 1px solid var(--rule);
    display: grid; grid-template-columns: 160px 1fr; gap: 24px; align-items: baseline;
  }
  .strip label { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-60); }
  .strip p { font-family: var(--f-display); font-size: clamp(22px, 3vw, 36px); font-weight: 300; letter-spacing: -0.02em; margin: 0; line-height: 1.2; }
  .back { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; display: inline-block; margin-bottom: 40px; color: var(--ink-60); }
  @media (max-width: 900px) { .grid, .strip { grid-template-columns: 1fr; } h1 { max-width: none; } }
</style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">← Examples</a>
    <div class="grid">
      <div>
        <div class="eyebrow">G001 — Matcha</div>
        <h1>Premium Grade Matcha</h1>
        <p class="jp">プレミアム抹茶</p>
        <hr class="rule"/>
        <p class="body">Shade-grown for 25 days. Longjin 43 and Yabukita cultivars. Every batch tested for pesticides and heavy metals.</p>
        <a class="cta" href="https://www.amazon.co.uk/dp/B0G8MW2WB7">Buy on Amazon</a>
      </div>
      <div class="photo">
        <img src="../assets/products-original-backup/matcha-homepage.jpg" alt="Premium Grade Matcha"/>
      </div>
    </div>
    <div class="strip">
      <div class="label">Ingredients</div>
      <p>Tencha (green tea). Shade-grown for 25 days prior to harvest.</p>
    </div>
  </div>
</body>
</html>
