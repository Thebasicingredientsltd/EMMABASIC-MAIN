<body data-screen-label="Our Products">

<script src="data/catalog.js?v=20260921114202717"></script>

<script type="text/babel" src="components/Placeholder.jsx?v=2"></script>
<script type="text/babel" src="components/motion.jsx?v=2"></script>
<script type="text/babel" src="components/TopNav.jsx?v=17"></script>

<script type="text/babel" src="components/products-catalog.jsx?v=82"></script>
<script type="text/babel" src="components/CatalogIndex.jsx?v=24"></script>
<script type="text/babel" src="components/Sections.jsx?v=5"></script>

<script type="text/babel">
function OurProductsApp() {
  const catalog = window.EB_CATALOG;
  const page = (!Array.isArray(catalog) && catalog) || {};
  const hero = page.hero || {};
  return (
    <>
      <TopNav hasHero={false} />
      <main>
        <PageHero
          cmsKey="catalog"
          visible={hero.visible}
          eyebrow={hero.eyebrow || "Our Products — N°01 through N°07"}
          title={hero.title || "Small shelf,"}
          titleItalic={hero.titleItalic || "big intention."}
          subtitle={hero.subtitle || "Seven categories. No additives, no fillers, no shortcuts. The range is growing slowly — each product earns its place, or it doesn't ship."}
        />
        <CatalogIndex />
      </main>
      <SiteFooter visible={(page.footer || {}).visible} />
    </>
  );
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<OurProductsApp />);
</script>
